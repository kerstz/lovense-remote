name: Release APK

# Builds, tests and signs the release APK on every v* tag, then attaches it to
# the GitHub Release together with SHA256SUMS and a build-provenance attestation.
# Required secrets (Settings → Secrets → Actions) — the job FAILS without them,
# an unsigned APK is never published:
#   SIGNING_KEYSTORE_BASE64  = base64 of a .jks keystore (base64 -w0 keystore.jks)
#   SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# Verify a download:  sha256sum -c SHA256SUMS
#                     gh attestation verify app-release.apk -R kerstz/lovense-remote

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release / upload assets
      id-token: write        # build-provenance attestation (OIDC)
      attestations: write
    steps:
      # Actions pinned by commit SHA (tag in the comment, bumped by Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # Also validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-disabled: true

      - name: Unit tests and lint
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease --no-daemon

      - name: Decode keystore (required)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SP: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KA: ${{ secrets.SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$SP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets missing: refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KS=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_FILE: ${{ env.KS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify signature and write checksums
        working-directory: app/build/outputs/apk/release
        run: |
          set -euo pipefail
          if ls *unsigned*.apk >/dev/null 2>&1 || [ ! -f app-release.apk ]; then
            echo "::error::Signed app-release.apk not produced."; ls -la; exit 1
          fi
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app-release.apk
          sha256sum app-release.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: app/build/outputs/apk/release/app-release.apk

      - name: Attach APK to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS
