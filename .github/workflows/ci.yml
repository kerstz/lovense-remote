name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build · test · lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Actions pinned by commit SHA (tag in the comment, bumped by Dependabot).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      # Also validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  generated-docs:
    name: Generated docs are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 tools/gen_supported.py && python3 tools/gen_site_data.py
      - name: Fail if generated docs are stale
        run: git diff --exit-code docs/SUPPORTED_TOYS.md docs/toys.json

  # Resolves the release runtime classpath into a Gradle lockfile (not
  # versioned) so that OSV can check every transitive artifact against known
  # vulnerabilities.
  lockfile:
    name: Resolve dependencies for the OSV scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Write app/gradle.lockfile
        run: |
          ./gradlew -I tools/lockfile.init.gradle.kts :app:dependencies --write-locks \
            --configuration releaseRuntimeClasspath --no-daemon
          test -s app/gradle.lockfile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gradle-lockfile
          path: app/gradle.lockfile
          if-no-files-found: error

  osv-scan:
    name: OSV vulnerability scan
    needs: lockfile
    # No `timeout-minutes` here: GitHub rejects it on a job that calls a reusable
    # workflow (`uses:`); the called workflow's own job settings apply.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      download-artifact: gradle-lockfile
      upload-sarif: false
      fail-on-vuln: true
