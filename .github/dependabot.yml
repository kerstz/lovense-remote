version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      ktor:
        patterns: ["io.ktor*"]
      bouncycastle:
        patterns: ["org.bouncycastle*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
