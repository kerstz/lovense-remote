name: 🐛 Bug report
description: Something in the app is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs. what you got.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: App version + Android version / phone
      placeholder: 0.2.0 · GrapheneOS 2026… · Pixel 8
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      render: text
